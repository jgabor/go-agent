header:
  level: full
  created: 2026-05-07
  status: completed
  approved: 2026-05-07
  reviewed: 2026-05-07
  critic_issues: "20 found, 20 addressed, 0 dismissed"
  revised: >-
    Split grammar from assembly/runtime migration, made error and terminal-event
    semantics explicit, moved provider proof earlier, constrained generic options
    and usage metadata, separated transcript/tool/session/policy risks, and added
    acceptance for API break lists, deterministic replay, simple-model ergonomics,
    and artifact freshness.
  title: "Plan: Streaming-Primary Runtime Contract"
what: >-
  Redesign go-agent's public model, event, message, result, and tool-result
  contracts so provider streaming is the primary runtime seam. Event becomes the
  authoritative run stream, Message becomes block-based for transcript content,
  completion results are assembled from streaming, and generic options, usage,
  and JSON-capable tool results are represented without importing Lira product
  policy.
why: >-
  Lira integration exposed that the current turn-only Model and whole-message
  EventTextDelta cannot faithfully represent provider deltas, usage, tool-call
  streaming, or structured tool results. Pi's lower-level agent and ai packages
  show a coherent alternative: streaming is the primitive, completion is a
  projection, and event/message grammar is the stable integration seam. The
  project is young enough to break early, and go-agent's vision requires every
  turn, tool call, retry, and stop reason to be reconstructable without
  guesswork.
constraints: >-
  Keep the core library-first and host-owned. Do not add provider registry,
  credential discovery, auth assembly, settings, prompts, resources, product
  CLI/TUI behavior, MCP, sub-agent orchestration, workflow DSL, hosted platform,
  model marketplace, background shell abstraction, Lira provider policy, workdir
  behavior, workflow recovery categories, or pricing. Preserve plain Go public
  vocabulary around Agent, Runner, Tool, Session, Event, and Policy. Completion
  APIs must remain ergonomic as projections over streaming. Stream failures
  remain Go errors and also produce terminal error/stop events once a turn has
  been accepted.
scope:
  included:
    - Public contract break list for model, event, message, result, usage, options, and tool-result surfaces.
    - Canonical event grammar with ordering, correlation, delta aggregation, terminal, usage, stop, and error semantics.
    - Block-based transcript messages for text, tool calls, and tool results.
    - Deterministic stream assembler/reducer that reconstructs messages, usage, stop reason, and final results.
    - Streaming-primary model execution with simple-model adapter ergonomics.
    - Generic turn options, usage metadata, and JSON-compatible tool results.
    - Existing OpenAI-compatible provider proof against the new grammar.
    - Tests, package docs, examples, README roadmap, and Agentera state freshness.
  excluded:
    - Lira-side adapters, Lira provider deletion, or Lira integration test ownership.
    - Provider registry, provider selection, aliases, auth, settings, prompt/resource loading, and CLI subprocess providers.
    - Cost accounting, pricing policy, model marketplace metadata, and workflow budget/recovery policy.
    - Broad provider coverage beyond the existing OpenAI-compatible proof adapter.
    - MCP, sub-agent orchestration, workflow DSL, hosted platform, UI, TUI, or product shell behavior.
  deferred:
    - Anthropic provider package.
    - OpenAI Responses provider package.
    - Lira adapter implementation and Lira parity tests.
    - File-backed or database-backed session/replay packages.
    - Post-break event versioning, unless implementation discovers persisted event compatibility pressure.
design: >-
  Specify the canonical event and block-message grammar first, then prove it with
  a narrow provider spike before migrating the runtime. Build a deterministic
  stream assembler as the bridge between streaming events and final results.
  Provider-specific wire details normalize before reaching Event, while bounded
  diagnostics can preserve request IDs, provider/package identifiers, raw stop
  reasons, and non-secret opaque metadata. Completion callers use final results
  assembled from the same stream consumed by Event sinks and Runner.Stream.
  Simple fake, local, and test models remain concise through an adapter that
  converts a final response into the canonical stream. No backward session
  migration is required unless a concrete persisted-session consumer is found;
  otherwise old session shapes may be intentionally rejected during the break.
tasks:
  - number: 1
    name: Define the breaking contract boundary
    depends_on: []
    status: completed
    completed: 2026-05-07
    evidence: >-
      Added docs/streaming-primary-contract-boundary.md after reviewing current
      Run, Stream, Model, Message, ToolResult, provider, session, event, docs,
      and examples. The document lists intentional public breaks by changed
      type, field, method, event name, and semantic behavior; keeps registry,
      auth, settings, prompts, resources, CLI shell behavior, MCP, sub-agents,
      workflow DSL, workdir behavior, pricing, and Lira policy outside core;
      classifies old session/event shapes as migrated, rejected, or unsupported;
      and records that later compile failures against the old API are expected
      consequences of named breaks.
    acceptance:
      - GIVEN current public Run, Stream, Model, Message, ToolResult, provider, session, and event behavior is reviewed WHEN the target contract is declared THEN each intentional public break is listed by changed type, field, method, event name, or semantic behavior.
      - GIVEN the target contract is declared WHEN non-goals are checked THEN registry, auth, settings, prompts, resources, CLI shell behavior, MCP, sub-agents, workflow DSL, workdir behavior, pricing, and Lira policy remain outside core.
      - GIVEN existing session or event persistence is considered WHEN the break list is recorded THEN old shapes are explicitly classified as migrated, rejected, or unsupported because no concrete compatibility owner exists.
      - GIVEN docs and examples are reviewed WHEN Task 1 completes THEN any future compile failures are expected consequences of named breaks rather than accidental drift.
  - number: 2
    name: Specify event and block-message grammar
    depends_on: [1]
    status: completed
    completed: 2026-05-07
    evidence: >-
      Added docs/streaming-primary-event-grammar.md as a specification-only
      grammar for block-based messages and canonical streaming events. The
      grammar covers text, tool-call, and tool-result blocks; response start,
      block delta/end, final message, tool-call-ready, tool-result, usage, stop,
      and error events; deterministic terminal ordering where terminal error can
      occur only before final stop and stop admits no following events; streamed
      partial tool-call names/arguments, call IDs, concurrent calls, malformed
      and incomplete streams, and finalization before execution; generic
      token/cache/request usage metadata; and bounded generic options while
      excluding registry, auth, settings, prompts/resources, CLI shell behavior,
      MCP, sub-agents, workflow DSL, workdir behavior, pricing, marketplace
      metadata, budget policy, and Lira policy from core.
    acceptance:
      - GIVEN transcript content is represented WHEN messages are inspected THEN text, tool-call, and tool-result blocks can be represented without provider-specific parsing.
      - GIVEN a streaming assistant response emits content WHEN events are inspected THEN start, delta, end, final message, usage, stop, and error semantics have non-contradictory ordering rules.
      - GIVEN tool calls stream incrementally WHEN events are inspected THEN partial tool-call names, argument deltas, call IDs, multiple concurrent calls, malformed streams, incomplete streams, and finalization before execution are covered by the grammar.
      - GIVEN usage metadata is represented WHEN fields are reviewed THEN token/cache/request metadata is allowed while cost, pricing, budget policy, marketplace metadata, and Lira cost policy are excluded.
      - GIVEN generic options are represented WHEN fields are reviewed THEN max output tokens, temperature, reasoning effort, stop sequences, response format, and bounded host-supplied provider extensions are allowed while auth, registry, provider selection, persisted settings, pricing, workdir, and Lira policy are excluded.
  - number: 3
    name: Prove grammar against provider behavior
    depends_on: [2]
    status: completed
    completed: 2026-05-07
    evidence: >-
      Added docs/streaming-primary-openai-provider-proof.md and
      providers/openai/streaming_grammar_proof_test.go as a proof-only harness
      for the existing OpenAI-compatible provider package. The proof simulates
      streaming text, streamed tool-call deltas by provider index, usage,
      finish reasons, pre-acceptance setup failure, and accepted-turn provider
      failure; normalizes them into the Task 2 canonical events without any
      provider-specific event field; proves terminal accepted failures emit
      error, optional usage, then final stop; preserves request ID,
      provider/package identifiers, raw stop reason, and bounded opaque
      diagnostics while rejecting credential, registry, marketplace, pricing,
      and Lira policy metadata; and verifies ChatModel remains limited to
      Model, APIKey, BaseURL, and HTTPClient rather than adding auth discovery,
      provider registry/selection, marketplace, workdir, pricing, or product
      policy behavior. No runtime or provider migration was implemented, and no
      grammar revision was required.
    acceptance:
      - GIVEN the existing OpenAI-compatible provider proof runs against the draft grammar WHEN streaming text, tool calls, usage, finish reasons, setup failures, and accepted-turn provider failures are simulated THEN no provider-specific event field is required.
      - GIVEN provider diagnostics are surfaced WHEN events or errors are inspected THEN request IDs, provider/package identifiers, raw stop reasons, and non-secret opaque metadata can be retained without exposing credentials or product policy.
      - GIVEN provider behavior cannot be represented WHEN the proof is reviewed THEN the grammar is revised before runtime migration begins.
      - GIVEN provider package configuration is reviewed WHEN Task 3 completes THEN custom auth discovery, provider registry, provider selection, and model marketplace behavior are still absent from core.
  - number: 4
    name: Build deterministic stream assembly
    depends_on: [2, 3]
    status: completed
    completed: 2026-05-07
    evidence: >-
      Added stream_assembly.go with block/message/usage event fields and a
      deterministic AssembleEvents reducer plus AssembleStream completion-style
      error projection. The reducer reconstructs final transcript messages,
      assistant text, finalized tool calls, tool results, usage metadata, stop
      reasons, and terminal errors from canonical response_start,
      content_block_start, text_delta, tool_call_delta, content_block_end,
      message_final, tool_call_ready, tool_result, usage, error, and stop
      events. It validates replay deterministically by rejecting non-monotonic,
      malformed, incomplete, post-stop, duplicate-terminal, and contradictory
      final/stop/error facts with StreamDivergenceError instead of guessing.
      Terminal error events are accepted only after response_start and must be
      paired with a terminal stop, matching the grammar's accepted-stream error
      contract; AssembleStream now deterministically rejects accepted stream
      errors whose returned Go error does not exactly or explicitly match the
      terminal EventError.Err through Go error identity semantics. stream_assembly_test.go
      covers successful reconstruction, replay equality, deterministic
      divergence, EventError without response_start, response_start plus
      EventError without EventStop, setup errors, provider errors before accepted
      content, accepted-turn stream errors, mismatched returned and terminal
      errors, tool execution errors, policy stops, context cancellation, retry
      exhaustion, step limits, and contradictory terminal facts. Runtime/provider
      migration remains deferred to Task 5, and
      no registry, auth discovery, settings, prompts/resources, CLI shell, MCP,
      sub-agent, workflow DSL, hosted platform, model marketplace, background
      shell, workdir, pricing, Lira policy, or broad provider behavior was added.
    acceptance:
      - GIVEN canonical events are reduced WHEN a run completes THEN final transcript messages, tool calls, tool results, usage metadata, stop reason, and final result text are reconstructed deterministically.
      - GIVEN stored events are replayed WHEN the same reducer runs THEN the reconstructed result matches the original run or reports a deterministic divergence.
      - GIVEN setup errors, mid-stream provider errors before accepted content, accepted-turn stream errors, tool execution errors, policy stops, context cancellation, retry exhaustion, and step limits occur WHEN terminal behavior is inspected THEN Go error returns and terminal events follow the declared contract.
      - GIVEN redundant terminal information exists WHEN events are reduced THEN final, stop, and error events cannot produce contradictory final results.
  - number: 5
    name: Migrate runtime to streaming-primary execution
    depends_on: [4]
    status: completed
    completed: 2026-05-07
    evidence: >-
      Migrated the public Model seam from Turn to Stream(ctx, TurnRequest,
      emit) and changed Runner execution so accepted model turns are consumed as
      canonical response_start, content_block_start, text_delta,
      tool_call_delta, content_block_end, message_final, tool_call_ready, usage,
      error, and stop events. Run, Stream, and event sinks now observe the same
      runtime-assigned event sequence, and completion results are assembled from
      those events before session/tool-loop updates. Added ModelFromSimple,
      SimpleModel, SimpleModelFunc, and StreamTurnResult so tests, examples, and
      local models can still return final TurnResult values while the adapter
      emits canonical streams. Setup failures before response_start return Go
      errors without accepted-turn transcript events; accepted stream failures
      require terminal error/stop events and return the matching Go error.
      Updated OpenAI-compatible provider/tests, package docs, README usage,
      examples, runtime tests, and streaming acceptance tests to compile against
      the new streaming-primary API only. No registry, auth discovery, settings,
      prompts/resources, CLI shell, MCP, sub-agents, workflow DSL, hosted
      platform, model marketplace, background shell abstraction, workdir
      behavior, pricing, Lira policy, or broad provider coverage was added.
    acceptance:
      - GIVEN a streaming model drives a run WHEN Run, Stream, and event sinks observe it THEN they consume the same canonical event sequence and produce the same assembled final result.
      - GIVEN a non-streaming fake or local model is used WHEN tests and examples are written THEN a helper or adapter converts the final response into the canonical stream without forcing complex model implementations.
      - GIVEN model setup fails before a turn is accepted WHEN callers inspect results THEN the error behavior is idiomatic Go and no fake accepted-turn transcript is produced.
      - GIVEN an accepted stream fails WHEN callers inspect results and events THEN the Go error is returned and terminal error/stop events are emitted for event consumers.
      - GIVEN package docs and examples compile during migration WHEN public APIs change THEN callers see only the new streaming-primary contract.
  - number: 6
    name: Align tools, policy, sessions, and metadata
    depends_on: [4, 5]
    status: completed
    completed: 2026-05-07
    evidence: >-
      Aligned tool results, policy facts, session snapshots, and runtime metadata
      with the canonical block/event grammar. Tool-result messages now carry
      stable tool-result block IDs and preserve text or JSON-compatible values
      through EventToolResult, policy DecisionToolResult, reducer projections,
      RunResult events, and MemorySessionStore snapshots. Explicit policy hooks
      now receive DecisionStop facts with the stop reason and pre-stop canonical
      event history, while run, tool-call, tool-result, and retry decisions keep
      cloned block/session/tool metadata instead of provider-specific payloads.
      RunResult now exposes latest generic Usage assembled from stream events,
      sessions save user/tool/assistant block messages in transcript order, and
      session/event/result snapshots defensively clone block JSON values. Added
      TestRunnerPreservesBlockJSONToolResultsAcrossPolicyEventsAndSessions and
      updated event-history/runtime behavior expectations for explicit stop
      policy inspection. Existing tool safety, constraints, retry eligibility,
      and metadata-locality tests continue to pass without adding schema
      registry, MIME/resource loading, MCP blocks, pricing, Lira policy,
      provider registry, auth discovery, settings, prompts/resources, CLI shell,
      sub-agents, workflow DSL, hosted platform, model marketplace, background
      shell abstraction, workdir behavior, or broad provider coverage.
    acceptance:
      - GIVEN a tool returns text or structured JSON-compatible content WHEN the result is added to the transcript THEN block messages, events, policy views, and sessions preserve the same value without schema registry, MIME/resource loading, MCP blocks, pricing, or Lira policy.
      - GIVEN policy hooks inspect run, tool-call, tool-result, retry, and stop decisions WHEN the new grammar is active THEN they receive stable block/message/event facts rather than provider-specific payloads.
      - GIVEN sessions load, save, and resume runs WHEN block-based transcripts are present THEN session snapshots preserve transcript order, tool-call IDs, tool-result IDs, usage metadata where applicable, and stop state according to the declared break policy.
      - GIVEN tool safety, constraints, retry eligibility, and metadata locality are inspected WHEN tool execution succeeds or fails THEN current runtime-focused behavior remains reconstructable through the new event grammar.
  - number: 7
    name: Plan-level freshness checkpoint
    depends_on: [1, 2, 3, 4, 5, 6]
    status: completed
    completed: 2026-05-07
    evidence: >-
      Reviewed repository docs and public examples after Tasks 1-6 completed the
      streaming-primary runtime contract. README roadmap now describes the agent
      loop as streaming-primary, stream evidence as Runner Stream plus assembly
      tests, and the OpenAI-compatible provider as implementing Model.Stream
      without adding implementation-heavy migration detail. AGENTS.md now records
      the current streaming-primary seam and ModelFromSimple adapter guidance.
      TODO.md records this plan-level freshness checkpoint. The Lira gap-analysis
      follow-up now distinguishes closed generic go-agent runtime gaps from
      still-Lira-owned provider registry, auth, CLI subprocess, workflow, workdir,
      pricing, and product-policy responsibilities. Package docs, examples, and
      provider docs were reviewed. A Task 7 inspektera retry corrected the stale
      historical wording in docs/streaming-primary-openai-provider-proof.md so it
      now states that the Task 3 proof was pre-migration evidence and that the
      current providers/openai.ChatModel implements goagent.Model through
      ChatModel.Stream without adding provider registry, auth discovery, workdir,
      pricing, or Lira product policy behavior. A second Task 7 inspektera retry
      corrected docs/pi-coding-agent-breakdown.md so its Pi comparison now says
      current ergonomics match the README through `goagent.New(...)` options over
      explicit `Agent`/`NewRunner` wiring, and keeps future guidance focused on
      streaming-primary consumers rather than rebuilding an already-present
      facade. Verification passed with Agentera plan/progress/todo checks and
      `mage check`.
    acceptance:
      - GIVEN the streaming-primary contract work completes WHEN repository docs are reviewed THEN README roadmap, package docs, examples, provider docs, AGENTS.md guidance, and the Lira gap-analysis follow-up no longer contradict repository reality.
      - GIVEN README is updated WHEN public semantics change THEN it stays focused on product shape, public usage, and roadmap status rather than implementation-heavy migration details.
      - GIVEN Agentera state is updated WHEN the plan completes THEN `.agentera/plan.yaml`, `.agentera/progress.yaml` if used, and relevant TODO entries reflect completed work and recorded surprises.
      - GIVEN local verification runs WHEN the plan completes THEN `mage check` succeeds or blockers are recorded with exact failing gates.
overall_acceptance:
  - GIVEN users consume Runner.Stream or event sinks WHEN provider-backed runs stream text, tool calls, tool results, usage, stops, or errors THEN Event is the authoritative reconstructable stream.
  - GIVEN users call completion-style APIs WHEN runs finish THEN final results are assembled from the same stream rather than from a separate turn-only path.
  - GIVEN hosts use simple fake, local, or test models WHEN adopting the new API THEN they can remain concise through an adapter or helper.
  - GIVEN Lira later builds adapters WHEN mapping its stream-first drivers and block messages THEN missing seams are generic go-agent runtime/provider contracts, not Lira product policy features.
  - GIVEN product boundaries are reviewed WHEN the plan completes THEN go-agent still does not own provider registry, auth, CLI subprocesses, workflow policy, workdir behavior, pricing, MCP, sub-agent orchestration, or workflow DSL.
surprises:
  - Task 7 found the Lira gap analysis still described several pre-migration facts as current reality: Model.Turn as the model seam, string-only messages/tool results, missing generic usage, and a non-streaming model boundary. The conclusion stayed the same, but the current-gap matrix needed a freshness follow-up so Lira-owned policy/provider surfaces did not get confused with already-closed generic runtime seams.
