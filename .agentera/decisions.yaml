decisions:
  - number: 1
    date: 2026-05-06
    question: How should go-agent adapt Pi coding-agent patterns without becoming a product shell?
    context: >-
      Pi's coding-agent package demonstrated a factory-first SDK, broad runtime
      lifecycle hooks, rich tool definitions, and product-level assembly for
      auth, settings, skills, prompts, resources, sessions, extensions, and UI.
      go-agent's vision remains library-first: a compact Go runtime that accepts
      resolved host dependencies and avoids hosted platforms, workflow DSLs,
      permission theater, mandatory CLIs, and product-owned resource lifecycle.
    alternatives:
      - name: '[Pi-like product shell]'
        status: rejected
        tradeoffs: >-
          Would provide batteries-included auth, settings, resources, lifecycle
          hooks, and extension mutation, but would turn the root runtime into a
          framework/product shell and conflict with host-owned Go integration.
        win_condition: >-
          Choose this only if go-agent intentionally pivots from embeddable
          runtime to full agent application framework.
      - name: '[go-agent minimal core only]'
        status: rejected
        tradeoffs: >-
          Preserves maximum explicitness through Agent and NewRunner but weakens
          the one-import turnkey promise as retry, compaction, runtime defaults,
          and richer tools arrive.
        win_condition: >-
          Choose this if keeping every construction choice explicit matters more
          than quick-start ergonomics and runtime defaults.
      - name: '[Adapted runtime-first ergonomics]'
        status: chosen
        tradeoffs: >-
          Adapts Pi's factory-first SDK and rich tool authoring while rejecting
          product assembly. The core supplies runtime defaults and typed control
          points; the host still owns auth, settings, skills, prompts, resource
          loading, and product lifecycle.
        win_condition: >-
          Users get a turnkey runner through a small facade while advanced users
          can still inspect and wire Agent, Policy, Tool, SessionStore, EventSink,
          RuntimeConfig, and ToolDefinition explicitly.
    choice: >-
      Use adapted runtime-first ergonomics: add a primary New(options...) facade
      over explicit Agent/NewRunner construction; keep product assembly
      host-owned; avoid a mutable Pi-like lifecycle bus in core; route retry
      through typed Policy decisions; and make a rich ToolDefinition the
      canonical advanced tool authoring path while keeping simple function tools
      easy.
    reasoning: >-
      The deciding variable was what "turnkey" means. For go-agent, turnkey
      should mean safe runtime defaults and strong tool/runtime ergonomics, not
      ownership of auth, settings, skills, prompts, registries, or UI. Pi is a
      useful model for one shared SDK path and high-quality tool definitions, but
      its extension/resource shell belongs outside go-agent's root runtime.
    confidence: provisional
    feeds_into: [VISION.md, TODO.md]
  - number: 2
    date: 2026-05-07
    question: Which Lira integration gaps should go-agent address on its side?
    context: >-
      Lira's provider replacement gap analysis correctly found that go-agent is
      not ready to replace Lira's provider layer, but its priorities were framed
      around replacement. During adversarial deliberation, the integration target
      was narrowed to shared seams first: Lira keeps provider registry, auth,
      CLI subprocesses, workflow policy, workdir behavior, and pricing, while
      go-agent strengthens only generic runtime/provider contracts.
    alternatives:
      - name: '[Adapter-only compatibility]'
        status: rejected
        tradeoffs: >-
          Would minimize go-agent API churn by forcing Lira adapters to buffer,
          stringify, and side-channel missing data, but would leave the runtime
          event stream unable to represent real provider behavior.
        win_condition: >-
          Choose this only if go-agent deliberately remains turn-only and treats
          provider token streaming as entirely host-owned.
      - name: '[Patch narrow gaps incrementally]'
        status: rejected
        tradeoffs: >-
          Adding turn options, usage, JSON tool results, and provider streaming
          one by one looks safer, but risks a mismatched public API where events,
          messages, and model results use different vocabularies.
        win_condition: >-
          Choose this if public API stability matters more than a coherent
          streaming/transcript model while the project is still young.
      - name: '[Break early for streaming-primary shared seams]'
        status: chosen
        tradeoffs: >-
          Requires redesigning public model, event, message, and result shapes,
          but gives go-agent one canonical stream for provider deltas, tool
          progress, terminal errors, usage metadata, and final transcript
          assembly. This keeps Lira product policy outside core while addressing
          the reusable runtime gap directly.
        win_condition: >-
          Users can consume Event as the authoritative run stream, reconstruct
          block-based messages from it, and still get ergonomic final results for
          non-streaming callers.
    choice: >-
      Break early toward a streaming-primary model contract: Event is the
      canonical streaming boundary; Message becomes block-based for text, tool
      calls, and tool results; completion results are assembled from streaming;
      turn options, usage metadata, and JSON-capable tool results become generic
      runtime/provider seams; accepted stream failures return Go errors and also
      emit terminal error/stop events.
    reasoning: >-
      Pi's coding-agent architecture treats provider streaming as the primitive
      and derives completion from the stream. That makes streaming an event and
      transcript design problem, not just an adapter feature. The deciding
      variable was whether Lira partial adoption should merely avoid loss or
      push go-agent toward a reusable production streaming contract. Because the
      project is young, a coherent breaking redesign is preferable to layering
      compatibility patches that become permanent.
    confidence: provisional
    feeds_into: [TODO.md]
  - number: 3
    date: 2026-05-07
    question: How should go-agent represent usage metadata after the Usage.Meta blocker?
    context: >-
      The Chat Completions Streaming Fidelity plan blocked because public
      Usage.Meta remained an arbitrary map while Task 2 required closed request
      options and diagnostics. Pi was reviewed as a comparison point: its Usage
      shape is typed, and Pi computes cost from maintained model pricing data in
      its codebase. go-agent has no model marketplace or pricing catalog and
      deliberately leaves provider pricing and product accounting to hosts such
      as Lira.
    alternatives:
      - name: '[Keep Usage.Meta]'
        status: rejected
        tradeoffs: >-
          Preserves flexibility for future provider-specific accounting facts,
          but leaves an arbitrary public map that is hard to verify, easy to
          misuse as diagnostics, and contradictory to the no-opaque-maps boundary.
        win_condition: >-
          Choose this only if go-agent deliberately accepts open-ended usage
          extension data in core.
      - name: '[Copy Pi usage and cost shape]'
        status: rejected
        tradeoffs: >-
          Matches Pi's input/output/cache/cost breakdown, but Pi owns a generated
          model pricing registry and calculates costs from that data. Copying the
          cost shape would push go-agent toward pricing truth it explicitly does
          not own.
        win_condition: >-
          Choose this only if go-agent adopts a provider/model pricing catalog or
          model marketplace responsibility.
      - name: '[Typed token/cache usage only]'
        status: chosen
        tradeoffs: >-
          Removes the arbitrary map and keeps usage as generic runtime/provider
          accounting: input tokens, output tokens, total tokens, cache read/write
          tokens, request ID, provider, and model. Hosts can compute cost from
          these facts using their own pricing policy.
        win_condition: >-
          Task 2 can pass with no opaque usage metadata map, no cost fields in
          core, and Lira still able to compute CostUSD externally.
    choice: >-
      Remove Usage.Meta and keep go-agent Usage closed and typed around
      token/cache/request/provider/model facts. Do not add cost fields to core;
      hosts such as Lira own pricing catalogs and cost calculation.
    reasoning: >-
      Pi shows that cost is not merely provider-reported data: it is calculated
      from model pricing maintained in the codebase. That is product/provider
      policy, not generic runtime state. The reusable go-agent seam should emit
      enough usage facts for hosts to account externally without owning pricing
      truth itself.
    confidence: firm
    feeds_into: [TODO.md]
  - number: 4
    date: 2026-05-11
    question: Should go-agent keep an optional developer CLI on its roadmap?
    context: >-
      The backlog and README still kept an optional go-agent developer CLI open
      as deferred work. That no longer matches project direction: Aila is being
      developed in a separate repository as the terminal coding-agent product,
      and go-agent is intended to dogfood through Aila rather than duplicate that
      CLI surface. The Aila gap request document should inform reusable runtime
      seams, but not move go-agent toward product-shell ownership.
    alternatives:
      - name: '[Keep optional go-agent CLI deferred]'
        status: rejected
        tradeoffs: >-
          Preserves a possible in-repo developer shell, but keeps inviting future
          agents to revive product work that Aila now owns.
        win_condition: >-
          Choose this only if Aila stops being the intended dogfood CLI or if a
          go-agent-specific shell proves necessary beyond examples.
      - name: '[Move runtime gaps directly into Now or Next]'
        status: rejected
        tradeoffs: >-
          Would convert Aila's architecture requests into immediate runtime work,
          but risks treating design evidence as implementation proof before
          dogfooding clarifies which gaps matter first.
        win_condition: >-
          Choose this after Aila dogfooding shows a concrete runtime gap blocking
          useful product progress.
      - name: '[Close go-agent CLI and dogfood through Aila]'
        status: chosen
        tradeoffs: >-
          Makes the product boundary explicit and keeps go-agent focused on
          library primitives. It does mean runtime priorities should be promoted
          later from observed Aila pressure, not from the CLI closure itself.
        win_condition: >-
          Future agents treat Aila as the developer CLI product and update
          go-agent only for reusable runtime seams proven by that dogfood loop.
    choice: >-
      Do not build an optional developer CLI in go-agent. Aila owns the terminal
      coding-agent CLI and should be the dogfood product for go-agent runtime
      seams; go-agent should remain a library-first runtime beneath host
      applications.
    reasoning: >-
      The deciding variable was ownership boundary. A CLI would make go-agent a
      product shell competing with Aila's intended surface, while Aila can supply
      the real usage pressure needed to prioritize runtime-library gaps. Closing
      the CLI path now prevents stale deferred work from reappearing without
      prematurely promoting Aila's gap list into the active go-agent backlog.
    confidence: firm
    feeds_into: [README.md, TODO.md]
